name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      # The auth / intake / university-facts suites exercise the durable
      # Postgres model, so CI must run a real Postgres 18 (not SQLite).
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: schedulesolve
          POSTGRES_PASSWORD: schedulesolve
          POSTGRES_DB: schedulesolve
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U schedulesolve -d schedulesolve"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://schedulesolve:schedulesolve@localhost:5433/schedulesolve
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install
        run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Build native solver (C++ search core)
        run: bash backend/scripts/build_native.sh
      - name: Tests
        run: cd backend && python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: cd frontend && npm ci
      - name: Build
        run: cd frontend && npm run build
