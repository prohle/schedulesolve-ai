name: Keep demo warm (manual only)

# COST NOTE — why this is no longer scheduled.
#
# Modal is scale-to-zero and idles a container after ~60s without traffic, so
# a ping every 15 minutes does NOT keep the app warm: each ping pays a cold
# start, then the container idles again for the next 14 minutes. Measured
# rates for this stack (backend 1 core / 4 GiB, UI 1 core / 1 GiB):
#
#   backend warm: 1 * $0.0473/h + 4 * $0.008/h  = $0.079/h
#   UI warm:      1 * $0.0473/h + 1 * $0.008/h  = $0.055/h
#
# 480 pings over judging week (Nov 5-9) costs roughly $1.00-1.50 in cold
# starts, which is more than a small credit balance. Sparse judge
# traffic is far cheaper: one 2-minute session with both apps warm is ~$0.004.
#
# So: no schedule. Run this manually only when you are about to demo live and
# want the containers hot, e.g. 60 seconds before a call:
#
#   gh workflow run keepwarm.yml
#
# A cold start is ~10-20s (the image is cached), and the README already tells
# judges the first request may take a few seconds. That is a much better trade
# than exhausting the credit mid-judging.
on:
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: API status
        run: |
          code=$(curl -s -o /tmp/api.json -w "%{http_code}" -m 120 https://prohle--schedulesolve-ai-api.us-east.modal.run/status)
          cat /tmp/api.json
          test "$code" = "200"
      - name: UI
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -m 120 https://prohle--schedulesolve-ai-ui-web.us-east.modal.run)
          echo "UI HTTP $code"
          test "$code" = "200"
